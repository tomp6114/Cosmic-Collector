name: cosmic_collector_game
description: "A Flame-based space game where you collect stars and dodge enemies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  cupertino_icons: 1.0.8
  flame: 1.30.1
  flutter:
    sdk: flutter
  google_fonts: 6.2.1

dev_dependencies:
  flame_test: 2.0.1
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
